name: Sync labels

# Distributed into every repo by scripts/distribute-templates. Reads the repo's
# OWN .github/labels.yml (also distributed), so there is no dependency on the
# private .github repository. Runs automatically when that local labels.yml
# changes (e.g. when a distribution PR merges) or on manual dispatch.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/labels.yml"

permissions:
  issues: write
  contents: read

jobs:
  labels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync labels
        uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: false
          token: ${{ secrets.GITHUB_TOKEN }}
